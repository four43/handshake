# Test, build and publish the server image to ghcr.io/four43/handshake.
# Pull requests run everything but the push. A push to main publishes :<short hash> (e.g. :6fd9bf2); a git tag publishes :<tag>
# (e.g. :v1.2.3), and a release tag vX.Y.Z that is the newest of its major also moves :vX (e.g. :v1), so :v1 is the latest 1.x.
name: Docker image

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.91' # the Dockerfile's build image
      - uses: Swatinem/rust-cache@v2
      - name: Server tests
        run: cargo test --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Client tests
        working-directory: client
        run: |
          npm ci
          npm test

  image:
    name: Build, test and push the image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every tag, to find the newest release of this major
      - uses: docker/setup-buildx-action@v4
      - name: Major tag
        id: major
        # Only for a release tag (vX.Y.Z, no pre-release) that is the newest vX.*, so an old patch never moves :vX back.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" =~ ^(v[0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            major="${BASH_REMATCH[1]}"
            newest=$(git tag -l "$major.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            if [ "$tag" = "$newest" ]; then echo "tag=$major" >> "$GITHUB_OUTPUT"; else echo "$tag is older than $newest: :$major stays"; fi
          fi
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false # no :latest; :vX is the moving tag
          tags: |
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.major.outputs.tag }},enable=${{ steps.major.outputs.tag != '' }}
            type=ref,event=tag
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true # into the runner's Docker, so the exact image is tested before it is pushed
          tags: handshake:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Health check
        run: |
          tmp=$(mktemp -d); install -m 644 client/e2e/e2e.toml "$tmp/config.toml"
          docker run -d --name hs -p 127.0.0.1:18081:8080 -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -v "$tmp/config.toml:/etc/handshake/config.toml:ro" handshake:ci
          trap 'docker logs hs; docker rm -f hs >/dev/null' EXIT
          for _ in $(seq 50); do curl -fs http://127.0.0.1:18081/healthz >/dev/null && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:18081/healthz   # fails the step if the server is not up
          docker exec hs /usr/local/bin/handshake --healthcheck   # the image's own HEALTHCHECK command
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Playwright version
        id: pw
        working-directory: client
        run: |
          npm ci
          echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Headless Chromium
        working-directory: client
        # Only the browser, from Playwright's CDN: the runner image already has Chromium's system libraries (it ships Google
        # Chrome), so no apt-get. --with-deps once hung for minutes on an unreachable Ubuntu mirror.
        run: npx playwright install --only-shell chromium
      - name: End-to-end test (two Chromium pages over WebRTC through the image)
        timeout-minutes: 10
        working-directory: client
        env:
          IMAGE: handshake:ci
        run: npm run e2e
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          [ -n "$TAGS" ] || { echo "No tag for ${GITHUB_REF}: nothing to push (only main and git tags publish)"; exit 0; }
          for t in $TAGS; do docker tag handshake:ci "$t"; docker push "$t"; done

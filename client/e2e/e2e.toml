# Server config for the e2e test (client/e2e/run.sh). Pages are served from http://localhost:8099.
listen = "0.0.0.0:8080"
allow_localhost = true

[limits]
grace_secs = 30

[apps.e2e]
origins = []
max_players = 4
public_rooms = true
turn = true

# The built-in TURN server, published on 127.0.0.1 by run.sh. Both pages relay through it, so relay to relay stays
# in-process and the relay ports need no publishing; loopback must be an allowed peer.
[turn]
urls = ["turn:127.0.0.1:3478?transport=udp", "turn:127.0.0.1:3478?transport=tcp"]
listen = "0.0.0.0:3478"
relay_ports = "49160-49169"
external_ip = "127.0.0.1"
allowed_peers = ["127.0.0.0/8"]
